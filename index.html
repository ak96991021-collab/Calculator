<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KHAN</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            margin: 14px auto;
            height: 70vh;
            width: 20vw;
            border: 1px solid gray;
            border-radius: 8px;
            padding: 8px;
        }

        .container>input {
            width: 100%;
            height: 80px;
            border-radius: 8px;
            border: 1px solid gray;
            font-size: 20px;
            padding: 0px 10px;
            background-color: #f1f1f1;
        }

        .btns {
            height: 80%;
            width: 100%;
            margin-top: 6px;
            border-radius: 8px;
            display: flex;
            align-content: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .btns>button {
            border: none;
            border-radius: 4px;
            background-color: #494949;
            color: #ececec;
            width: 50px;
            height: 40px;
            font-size: 20px;
            font-weight: 600;
        }
    </style>

</head>

<body>

    <div class="container">
        <input type="text" disabled placeholder="0">
        <div class="btns">
            <button  onclick="
            currentValue = '';
            document.querySelector('input').value = currentValue; 
            ">C</button>
            <button onclick="
            currentValue = currentValue + '0';
            document.querySelector('input').value = currentValue; 
            ">0</button>
            <button  onclick="
            currentValue = currentValue + '1';
            document.querySelector('input').value = currentValue; 
            ">1</button>
            <button  onclick="
            currentValue = currentValue + '+';
            document.querySelector('input').value = currentValue; 
            ">+</button>
            <button  onclick="
            currentValue = currentValue + '2';
            document.querySelector('input').value = currentValue; 
            ">2</button>
            <button  onclick="
            currentValue = currentValue + '3';
            document.querySelector('input').value = currentValue; 
            ">3</button>
            <button  onclick="
            currentValue = currentValue + '4';
            document.querySelector('input').value = currentValue; 
            ">4</button>
            <button  onclick="
            currentValue = currentValue + '-';
            document.querySelector('input').value = currentValue; 
            ">-</button>
            <button  onclick="
            currentValue = currentValue + '5';
            document.querySelector('input').value = currentValue; 
            ">5</button>
            <button  onclick="
            currentValue = currentValue + '6';
            document.querySelector('input').value = currentValue; 
            ">6</button>
            <button  onclick="
            currentValue = currentValue + '7';
            document.querySelector('input').value = currentValue; 
            ">7</button>
            <button  onclick="
            currentValue = currentValue + '*';
            document.querySelector('input').value = currentValue; 
            ">*</button>
            <button  onclick="
            currentValue = currentValue + '8';
            document.querySelector('input').value = currentValue; 
            ">8</button>
            <button  onclick="
            currentValue = currentValue + '9';
            document.querySelector('input').value = currentValue; 
            ">9</button>
            <button  onclick="
            currentValue = currentValue + '.';
            document.querySelector('input').value = currentValue; 
            ">.</button>
            <button  onclick="
            currentValue = currentValue + '/';
            document.querySelector('input').value = currentValue; 
            ">/</button>
            <button  onclick="
            currentValue = eval(currentValue);
            document.querySelector('input').value = currentValue; 
            ">=</button>
        </div>
    </div>

    <script>
        let currentValue = '';
        document.querySelector('input').value = currentValue;
    </script>

</body>

</html>
